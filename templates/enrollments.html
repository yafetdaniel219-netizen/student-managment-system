{% extends 'base.html' %}
{% block title %}Enrollments{% endblock %}

{% block content %}
<main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="bg-white p-6 rounded-xl border shadow-sm">
        <h3 class="text-lg font-bold mb-4">New Enrollment</h3>
        <form method="POST">
            <select name="student_id" required class="w-full p-3 border rounded-lg mb-4">
                <option value="">Select Student</option>
                {% for s in students %}
                <option value="{{ s[0] }}">{{ s[1] }}</option>
                {% endfor %}
            </select>
            <select name="course_id" required class="w-full p-3 border rounded-lg mb-6">
                <option value="">Select Course</option>
                {% for c in courses %}
                <option value="{{ c[0] }}">{{ c[1] }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="w-full bg-orange-600 text-white py-3 rounded-lg font-bold">Enroll Student</button>
        </form>
    </div>
    <div class="md:col-span-2 bg-white rounded-xl border shadow-sm p-4">
        <h3 class="text-lg font-bold mb-4">Active Enrollments</h3>
        <ul class="divide-y">
            {% for e in enrollments %}
            <li class="py-3 flex justify-between">
                <span><strong class="text-slate-900">{{ e[1] }}</strong> enrolled in <strong class="text-blue-600">{{ e[2] }}</strong></span>
                <span class="text-slate-400 text-sm">{{ e[3] }}</span>
            </li>
            {% endfor %}
        </ul>
    </div>
</main>
{% endblock %}
