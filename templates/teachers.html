{% extends 'base.html' %}
{% block title %}Teachers{% endblock %}

{% block content %}
<main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="bg-white p-6 rounded-xl border shadow-sm">
        <h3 class="text-lg font-bold mb-4">Add Teacher</h3>
        <form method="POST">
            <input type="text" name="name" placeholder="Teacher Name" required class="w-full p-3 border rounded-lg mb-4">
            <input type="email" name="email" placeholder="Teacher Email" required class="w-full p-3 border rounded-lg mb-6">
            <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold">Add Teacher</button>
        </form>
    </div>
    <div class="md:col-span-2 bg-white rounded-xl border shadow-sm p-4">
        <h3 class="text-lg font-bold mb-4">Teachers List</h3>
        <ul class="divide-y">
            {% for t in teachers %}
            <li class="py-3 flex justify-between">
                <span class="font-bold">{{ t[1] }}</span>
                <span class="text-slate-500">{{ t[2] }}</span>
            </li>
            {% endfor %}
        </ul>
    </div>
</main>
{% endblock %}
