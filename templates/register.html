<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center">Register</h2>
        {% if error %}<p class="text-red-500 text-sm mb-4">{{ error }}</p>{% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required class="w-full mb-4 p-3 border rounded-xl">
            <input type="email" name="email" placeholder="Email" required class="w-full mb-4 p-3 border rounded-xl">
            <input type="password" name="password" placeholder="Password" required class="w-full mb-6 p-3 border rounded-xl">
            <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold">Register</button>
        </form>
        <p class="mt-4 text-center text-sm">Already have an account? <a href="/login" class="text-blue-600">Login</a></p>
    </div>
</body>
</html>
