<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Management System{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
    <header class="bg-white border-b px-8 py-4 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-bold text-slate-900">Student Management System</h1>
        <nav class="space-x-6 text-sm font-medium">
            <a href="/students" class="text-slate-600 hover:text-slate-900">Students</a>
            <a href="/teachers" class="text-slate-600 hover:text-slate-900">Teachers</a>
            <a href="/courses" class="text-slate-600 hover:text-slate-900">Courses</a>
            <a href="/enrollments" class="text-slate-600 hover:text-slate-900">Enrollments</a>
            <a href="/logout" class="text-red-500 hover:text-red-600">Logout</a>
        </nav>
    </header>
    {% block content %}{% endblock %}
</body>
</html>
